[package]
name = "irc-colors-macros"
version = "0.1.0"
edition = "2021"
rust-version = "1.71"
license = "MIT"
description = "Procedural macro implementation for irc-colors"
repository = "https://github.com/seirl/irc-colors"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
